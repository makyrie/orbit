<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 64 64" role="img" aria-label="Perihelion">
  <title>Perihelion favicon</title>
  <!--
    Perihelion site icon (the browser-tab favicon / WordPress Site Icon).

    A "simplified orbit" mark: a planet at its perihelion — the closest point
    of an orbit to the star it circles, which is what the name means.

      - Tile   : solid Sienna, the brand accent, with rounded corners (rx=14).
      - Orbit  : a Paper-white ring at 85% opacity, deliberately OFF-CENTER
                 (cx/cy 34.1 vs the tile's 32) so the sun sits at the orbit's
                 focus rather than its geometric center — a true eccentric orbit.
      - Sun    : the honey disc, anchored at the tile center (32,32).
      - Planet : the Paper-white disc at 10:30, sitting on the ring at its
                 nearest approach to the sun (perihelion). The near gap is
                 smaller than the far sweep — the eccentricity is real.

    Brand tokens: Sienna #9C4B30, Paper #F7F3ED, Honey #E7B25A.
    This SVG is the source of truth; the deployed PNG (WordPress Site Icon,
    subsite 49 media library) is rasterized from it at 512x512.
  -->
  <rect width="64" height="64" rx="14" fill="#9C4B30"/>
  <circle cx="34.1" cy="34.1" r="18" fill="none" stroke="#F7F3ED" stroke-opacity="0.85" stroke-width="3.4"/>
  <circle cx="32" cy="32" r="6" fill="#E7B25A"/>
  <circle cx="21.4" cy="21.4" r="5" fill="#F7F3ED"/>
</svg>
